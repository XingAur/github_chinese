<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 中文增强</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <h1>GitHub 中文增强</h1>
      <p class="desc">把 GitHub 常见操作区、仓库页、PR 和 Issue 文案翻成更顺手的中文。</p>

      <label class="toggle">
        <span>启用汉化</span>
        <input id="enabled" type="checkbox">
      </label>

      <button id="translate-now" type="button">立即作用到当前页</button>
      <p id="status" class="status"></p>
      <p class="hint">关闭后请刷新 GitHub 页面，英文文案才会恢复。</p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
