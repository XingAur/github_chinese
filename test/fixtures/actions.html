<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Actions · XingAur/github_chinese</title>
</head>
<body>
  <header class="Header">
    <nav aria-label="global"><a href="#">Actions</a><a href="#">Settings</a></nav>
  </header>
  <main>
    <nav class="UnderlineNav">
      <a href="#">Summary</a>
      <a href="#">Artifacts and logs</a>
    </nav>
    <div class="Box">
      <div class="Box-header">
        <h2>Run workflow</h2>
        <span>Queued</span>
      </div>
      <div class="Box-body">
        <button type="button">Re-run failed jobs</button>
        <span>This job failed because one or more steps failed.</span>
      </div>
    </div>
    <div data-testid="log-body">
      <div>Run npm install &amp;&amp; npm run build</div>
      <div>##[error]Process completed with exit code 1.</div>
    </div>
    <pre><code>name: CI
on: push
jobs:
  build:
    runs-on: ubuntu-latest</code></pre>
    <button id="menu-btn" type="button">Open user menu</button>
  </main>
  <script>
    // 模拟 GitHub 新版头部：用户菜单渲染进挂在 body 之外的 React portal
    document.getElementById("menu-btn").addEventListener("click", function () {
      var portal = document.createElement("div");
      portal.id = "__primerPortalRoot__";
      portal.innerHTML =
        '<div class="dropdown-menu" role="menu">' +
        '<a role="menuitem" href="#">Stars</a>' +
        '<a role="menuitem" href="#">Gists</a>' +
        '<a role="menuitem" href="#">Copilot settings</a>' +
        '<a role="menuitem" href="#">Settings</a>' +
        '<a role="menuitem" href="#">Sign out</a>' +
        "</div>";
      document.documentElement.appendChild(portal);
    });
  </script>
</body>
</html>
